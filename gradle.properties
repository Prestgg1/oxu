org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# ABIs to build. A single ABI gives that ABI its own versionCode (see app/build.gradle.kts);
# release APKs are built one ABI at a time. For a fast local build: -Poxu.abis=arm64-v8a
oxu.abis=arm64-v8a,armeabi-v7a,x86_64
